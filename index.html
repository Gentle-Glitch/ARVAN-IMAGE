<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>아르반 데스페라 제국: 프롤로그</title>
    <style>
        body {
            background-color: #121212; /* 어두운 웹툰 배경색 */
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .webtoon-img {
            width: 100%;
            max-width: 1000px; /* 웹툰 표준 가로 너비 */
            display: block;
            margin: 0 auto; /* 컷 사이 여백을 주려면 margin-bottom: 20px; 등으로 수정 가능 */
        }
    </style>
</head>
<body>
    <!-- 태그 안에 올리신 이미지 파일명을 순서대로 적어주시면 됩니다 -->
    <img src="웹툰.jpg" class="webtoon-img" alt="1컷">
    <img src="cut02.png" class="webtoon-img" alt="2컷">
    <img src="cut03.png" class="webtoon-img" alt="3컷">
    <img src="cut04.png" class="webtoon-img" alt="4컷">
</body>
</html>
